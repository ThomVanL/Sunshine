---
name: CI-Homebrew-macOS-Validate
permissions: {}

on:
  workflow_dispatch:

jobs:
  validate:
    name: macos-${{ matrix.os_version }}
    permissions:
      contents: read
    runs-on: macos-${{ matrix.os_version }}
    strategy:
      fail-fast: false
      matrix:
        os_version:
          - "14"
          - "15"
          - "26"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Configure formula
        env:
          REPOSITORY_CLONE_URL: ${{ github.event.repository.clone_url }}
          REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          clone_url="${REPOSITORY_CLONE_URL}"
          commit="${GITHUB_SHA}"
          default_branch="${REPOSITORY_DEFAULT_BRANCH}"
          tag="${GITHUB_REF_NAME}"

          export BRANCH=${branch}
          export BUILD_VERSION="0.0.0"
          export CLONE_URL=${clone_url}
          export COMMIT=${commit}
          export TAG=${tag}

          mkdir -p build
          cmake \
            -B build \
            -S . \
            -DGITHUB_DEFAULT_BRANCH="${default_branch}" \
            -DSUNSHINE_CONFIGURE_HOMEBREW=ON \
            -DSUNSHINE_CONFIGURE_ONLY=ON

          mkdir -p homebrew
          cp -f ./build/sunshine.rb ./homebrew/sunshine.rb
          cat ./homebrew/sunshine.rb

      - name: Force formula tests on fork
        run: |
          # Ensure Homebrew validation builds and runs test_sunshine on fork runs.
          perl -i -pe 's/^  IS_UPSTREAM_REPO = .*/  IS_UPSTREAM_REPO = true/' ./homebrew/sunshine.rb
          grep -n "IS_UPSTREAM_REPO" ./homebrew/sunshine.rb

      - name: Seed macOS TCC permissions
        run: |
          set -euo pipefail

          append_unique_client() {
            local candidate_path="$1"

            if [[ -z "${candidate_path}" || ! -e "${candidate_path}" ]]; then
              return
            fi

            for existing_path in "${tcc_clients[@]:-}"; do
              if [[ "${existing_path}" == "${candidate_path}" ]]; then
                return
              fi
            done

            tcc_clients+=("${candidate_path}")
          }

          insert_tcc_row() {
            local service="$1"
            local client_path="$2"
            local db_path="$3"
            local column_count="$4"
            local values="'${service}','${client_path}',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1687786159"

            if [[ "${column_count}" -ge 17 ]]; then
              values="${values},NULL,NULL,'UNUSED',1687786159"
            fi

            echo "Granting ${service} to ${client_path} in ${db_path}"
            sudo sqlite3 "${db_path}" "INSERT OR IGNORE INTO access VALUES(${values});"
          }

          tcc_clients=()
          append_unique_client "/bin/bash"
          append_unique_client "/bin/sh"
          append_unique_client "/bin/zsh"
          append_unique_client "/opt/homebrew/bin/brew"

          while IFS= read -r provisioner_path; do
            append_unique_client "${provisioner_path}"
          done < <(sudo find /opt /usr -name provisioner 2>/dev/null | sort -u)

          if [[ ${#tcc_clients[@]} -eq 0 ]]; then
            echo "No TCC client paths found"
            exit 1
          fi

          echo "TCC client paths: ${tcc_clients[*]}"

          db_paths=(
            "/Library/Application Support/com.apple.TCC/TCC.db"
            "$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          )
          services=(
            "kTCCServiceAccessibility"
            "kTCCServiceMicrophone"
            "kTCCServiceAudioCapture"
            "kTCCServiceScreenCapture"
          )

          for db_path in "${db_paths[@]}"; do
            if [[ ! -f "${db_path}" ]]; then
              echo "Skipping missing TCC database: ${db_path}"
              continue
            fi

            echo "Column names for ${db_path}"
            echo "-------------------"
            sudo sqlite3 "${db_path}" "PRAGMA table_info(access);"

            column_count=$(sudo sqlite3 "${db_path}" "PRAGMA table_info(access);" | wc -l | tr -d ' ')
            echo "Detected access column count: ${column_count}"

            for service in "${services[@]}"; do
              echo "Current permissions for ${service} in ${db_path}"
              echo "-------------------"
              sudo sqlite3 "${db_path}" "SELECT * FROM access WHERE service='${service}';"

              for client_path in "${tcc_clients[@]}"; do
                insert_tcc_row "${service}" "${client_path}" "${db_path}" "${column_count}"
              done

              echo "Updated permissions for ${service} in ${db_path}"
              echo "-------------------"
              sudo sqlite3 "${db_path}" "SELECT * FROM access WHERE service='${service}';"
            done
          done

      - run: echo "::add-matcher::.github/matchers/gcc-strip3.json"
      - name: Validate Homebrew Formula
        id: test
        uses: LizardByte/actions/actions/release_homebrew@70bb8d394d1c92f6113aeec6ae9cc959a5763d15  # v2026.227.200013
        with:
          actionlint_config: "---\n# empty config"
          formula_file: ${{ github.workspace }}/homebrew/sunshine.rb
          git_email: ${{ secrets.GIT_EMAIL }}
          git_username: ${{ vars.GH_BOT_NAME }}
          publish: false
          token: ${{ secrets.GH_BOT_TOKEN }}
          validate: true
      - run: echo "::remove-matcher owner=gcc-strip3::"

      - name: Upload coverage artifact
        if: always() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure')
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: coverage-Homebrew-macos-${{ matrix.os_version }}
          path: |
            ${{ steps.test.outputs.testpath }}/coverage.xml
            ${{ steps.test.outputs.testpath }}/tests/test_results.xml
          if-no-files-found: error
